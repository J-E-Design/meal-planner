<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's for tea?</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E85D3D">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #FFF6EA; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: #3A2318;
    padding-bottom: 78px;
  }
  h1, h2, .heading { font-family: 'Baloo 2', system-ui, sans-serif; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 26px 20px 20px; }
  .header { text-align: center; margin-bottom: 4px; }
  .header h1 { font-weight: 800; font-size: 28px; margin: 0 0 2px; letter-spacing: -0.3px; }
  .header p { color: #8A7768; font-size: 14px; margin: 0; font-weight: 600; }

  .view { display: none; }
  .view.active { display: block; }

  /* Shuffle button */
  .shuffle-wrap { display: flex; justify-content: center; margin: 20px 0 26px; }
  .shuffle-btn {
    width: 140px; height: 140px; border-radius: 50%; border: none;
    background: linear-gradient(145deg, #F5B942, #E85D3D);
    box-shadow: 0 10px 0 #C8461F, 0 14px 22px rgba(232,93,61,0.35);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px;
    transition: transform 0.12s ease;
  }
  .shuffle-btn:active { transform: scale(0.95) translateY(4px); box-shadow: 0 4px 0 #C8461F; }
  .shuffle-btn:disabled { background: #E4DDD0; box-shadow: none; cursor: not-allowed; }
  .shuffle-btn svg { animation: none; }
  .shuffle-btn.spin svg { animation: spin 0.4s linear; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes pop { 0%{transform:scale(1) rotate(0)} 30%{transform:scale(.92) rotate(-4deg)} 60%{transform:scale(1.05) rotate(3deg)} 100%{transform:scale(1) rotate(0)} }
  .shuffle-btn.pop { animation: pop 0.4s ease; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
  .day-row.wiggle { animation: wiggle 0.36s ease; }

  /* Day rows */
  .day-row {
    display: flex; align-items: center; background: #fff; border-radius: 16px;
    padding: 12px 13px; margin-bottom: 9px; border: 1.5px solid #F0E6D6;
  }
  .day-badge {
    width: 42px; height: 42px; border-radius: 12px; background: #FBEFD9; color: #C4791A;
    display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif;
    font-weight: 700; font-size: 12px; margin-right: 12px; flex-shrink: 0;
  }
  .day-meal { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day-meal.empty { color: #C9BBA9; font-weight: 600; }
  .reroll-btn {
    border: none; background: #F5F1E8; width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; color: #8A7768; cursor: pointer; flex-shrink: 0;
  }
  .reroll-btn:active { transform: scale(0.9) rotate(90deg); }

  /* Shopping list card */
  .shop-card { background: #fff; border-radius: 16px; border: 1.5px solid #F0E6D6; padding: 16px; margin-top: 18px; }
  .shop-card h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .shop-card p.hint { font-size: 13px; color: #8A7768; margin: 0 0 12px; font-weight: 600; }
  .shop-list { font-size: 14px; line-height: 1.9; margin: 0 0 14px; padding-left: 18px; }
  .shop-actions { display: flex; gap: 8px; }
  .btn-secondary {
    flex: 1; border: 1.5px solid #E8DFCE; background: #FFFCF6; color: #3A2318; font-weight: 700;
    border-radius: 12px; padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary {
    flex: 1; border: none; background: #5B7F4B; color: #fff; font-weight: 700;
    border-radius: 12px; padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-secondary:active, .btn-primary:active { transform: scale(0.97); }

  /* Meals view */
  .meal-card {
    background: #fff; border-radius: 16px; border: 1.5px solid #F0E6D6; padding: 14px; margin-bottom: 10px;
  }
  .meal-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .meal-name { font-weight: 700; font-size: 16px; }
  .meal-ing { font-size: 13px; color: #8A7768; font-weight: 600; line-height: 1.5; }
  .meal-card-actions { display: flex; gap: 6px; }
  .icon-btn {
    border: none; background: #F5F1E8; width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; color: #8A7768; cursor: pointer;
  }
  .icon-btn.danger { color: #B4472E; }

  .add-meal-btn {
    width: 100%; border: 2px dashed #E8DFCE; background: transparent; color: #8A7768; font-weight: 700;
    border-radius: 16px; padding: 14px; font-size: 15px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
  }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(58,35,24,0.4); z-index: 50;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #FFF6EA; width: 100%; max-width: 460px; border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 19px; font-weight: 700; margin: 0 0 14px; }
  .field-label { font-size: 13px; font-weight: 700; color: #8A7768; margin: 0 0 6px; display: block; }
  .field-input, .field-textarea {
    width: 100%; border: 1.5px solid #F0E6D6; background: #fff; border-radius: 12px; padding: 11px 13px;
    font-size: 15px; font-family: inherit; font-weight: 600; color: #3A2318; outline: none; margin-bottom: 14px;
  }
  .field-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .modal-actions { display: flex; gap: 8px; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1.5px solid #F0E6D6;
    display: flex; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); z-index: 30;
  }
  .nav-btn {
    flex: 1; border: none; background: transparent; display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #B3A594;
    cursor: pointer;
  }
  .nav-btn.active { color: #E85D3D; }

  .empty-state { text-align: center; color: #B3A594; font-size: 14px; font-weight: 600; padding: 30px 10px; }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <h1 id="pageTitle">What's for tea?</h1>
    <p id="pageSubtitle">Tap the button, get a week of dinners.</p>
  </div>

  <!-- PLAN VIEW -->
  <div class="view active" id="planView">
    <div class="shuffle-wrap">
      <button class="shuffle-btn" id="shuffleBtn">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
        <span id="shuffleLabel">Plan my week</span>
      </button>
    </div>

    <div id="weekList"></div>

    <div class="shop-card">
      <h2>Shopping list</h2>
      <p class="hint">Ingredients for everything planned this week.</p>
      <ul class="shop-list" id="shopList"></ul>
      <div class="shop-actions">
        <button class="btn-secondary" id="copyBtn">Copy</button>
        <button class="btn-primary" id="shareBtn">Send to Keep</button>
      </div>
    </div>
  </div>

  <!-- MEALS VIEW -->
  <div class="view" id="mealsView">
    <div id="mealsList"></div>
    <button class="add-meal-btn" id="addMealBtn">+ Add a meal</button>
  </div>

</div>

<div class="bottom-nav">
  <button class="nav-btn active" data-view="plan">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    This week
  </button>
  <button class="nav-btn" data-view="meals">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M14 3v5h5"/></svg>
    My meals
  </button>
</div>

<!-- Meal editor modal -->
<div class="modal-overlay" id="mealModalOverlay">
  <div class="modal">
    <h2 id="mealModalTitle">Add a meal</h2>
    <label class="field-label">Meal name</label>
    <input class="field-input" id="mealNameInput" placeholder="e.g. Fish pie">
    <label class="field-label">Ingredients (one per line)</label>
    <textarea class="field-textarea" id="mealIngInput" placeholder="Salmon fillets&#10;Mashed potato&#10;Peas&#10;Cheddar"></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" id="mealCancelBtn">Cancel</button>
      <button class="btn-primary" id="mealSaveBtn">Save meal</button>
    </div>
  </div>
</div>

<script>
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const STORE_MEALS = "mp_meals_v1";
const STORE_WEEK = "mp_week_v1";

const STARTER_MEALS = [
  { id: "m1", name: "Spaghetti bolognese", ingredients: ["Mince beef","Spaghetti","Tinned tomatoes","Onion","Garlic","Parmesan"] },
  { id: "m2", name: "Tacos", ingredients: ["Taco shells","Mince beef","Cheddar","Lettuce","Salsa","Soured cream"] },
  { id: "m3", name: "Chicken curry", ingredients: ["Chicken thighs","Curry paste","Coconut milk","Rice","Coriander"] },
  { id: "m4", name: "Stir fry", ingredients: ["Noodles","Mixed veg","Soy sauce","Chicken or tofu","Ginger"] },
  { id: "m5", name: "Pizza night", ingredients: ["Pizza bases","Mozzarella","Passata","Toppings of choice"] },
];

function loadMeals() {
  try {
    const raw = localStorage.getItem(STORE_MEALS);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return STARTER_MEALS;
}
function saveMeals(meals) { localStorage.setItem(STORE_MEALS, JSON.stringify(meals)); }
function loadWeek() {
  try {
    const raw = localStorage.getItem(STORE_WEEK);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return Array(7).fill(null);
}
function saveWeek(week) { localStorage.setItem(STORE_WEEK, JSON.stringify(week)); }

let meals = loadMeals();
let week = loadWeek();
let editingMealId = null;

function uid() { return "m" + Date.now() + Math.floor(Math.random()*1000); }

function mealById(id) { return meals.find(m => m.id === id); }

function pickWeek() {
  const ids = meals.map(m => m.id);
  const result = [];
  let deck = [];
  for (let i = 0; i < 7; i++) {
    if (deck.length === 0) {
      deck = [...ids].sort(() => Math.random() - 0.5);
      if (result.length && deck[0] === result[result.length-1] && deck.length > 1) {
        [deck[0], deck[1]] = [deck[1], deck[0]];
      }
    }
    result.push(deck.pop());
  }
  return result;
}

function renderWeek() {
  const list = document.getElementById("weekList");
  list.innerHTML = "";
  const hasPlan = week.some(id => id !== null);
  document.getElementById("shuffleLabel").textContent = hasPlan ? "Shuffle again" : "Plan my week";
  document.getElementById("shuffleBtn").disabled = meals.length === 0;

  DAYS.forEach((day, i) => {
    const row = document.createElement("div");
    row.className = "day-row";
    row.id = "day-" + i;
    const meal = week[i] ? mealById(week[i]) : null;
    row.innerHTML = `
      <div class="day-badge">${day}</div>
      <div class="day-meal ${meal ? "" : "empty"}">${meal ? meal.name : "Not decided yet"}</div>
      ${meal ? `<button class="reroll-btn" data-day="${i}" aria-label="Reroll ${day}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0114.85-3.36L23 10M1 14l4.65 4.36A9 9 0 0020.5 15"/></svg>
      </button>` : ""}
    `;
    list.appendChild(row);
  });

  document.querySelectorAll(".reroll-btn").forEach(btn => {
    btn.addEventListener("click", () => rerollDay(parseInt(btn.dataset.day)));
  });

  renderShoppingList();
}

function shuffleAll() {
  if (meals.length === 0) return;
  const btn = document.getElementById("shuffleBtn");
  btn.classList.add("pop", "spin");
  setTimeout(() => {
    week = pickWeek();
    saveWeek(week);
    renderWeek();
    btn.classList.remove("pop", "spin");
  }, 380);
}

function rerollDay(i) {
  if (meals.length === 0) return;
  const others = meals.filter(m => m.id !== week[i]);
  const pool = others.length ? others : meals;
  const next = pool[Math.floor(Math.random() * pool.length)];
  week[i] = next.id;
  saveWeek(week);
  renderWeek();
  const row = document.getElementById("day-" + i);
  if (row) {
    row.classList.add("wiggle");
    setTimeout(() => row.classList.remove("wiggle"), 380);
  }
}

function buildShoppingList() {
  const seen = new Map();
  week.forEach(id => {
    if (!id) return;
    const meal = mealById(id);
    if (!meal) return;
    (meal.ingredients || []).forEach(ing => {
      const key = ing.trim().toLowerCase();
      if (key && !seen.has(key)) seen.set(key, ing.trim());
    });
  });
  return [...seen.values()];
}

function renderShoppingList() {
  const items = buildShoppingList();
  const ul = document.getElementById("shopList");
  if (items.length === 0) {
    ul.innerHTML = `<li style="list-style:none; margin-left:-18px; color:#B3A594; font-weight:600;">Plan your week to build a shopping list.</li>`;
    return;
  }
  ul.innerHTML = items.map(i => `<li>${escapeHtml(i)}</li>`).join("");
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById("shuffleBtn").addEventListener("click", shuffleAll);

document.getElementById("copyBtn").addEventListener("click", async () => {
  const items = buildShoppingList();
  if (items.length === 0) return;
  const text = items.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = original, 1400);
  } catch (e) {
    alert(text);
  }
});

document.getElementById("shareBtn").addEventListener("click", async () => {
  const items = buildShoppingList();
  if (items.length === 0) return;
  const text = items.join("\n");
  if (navigator.share) {
    try {
      await navigator.share({ title: "Shopping list", text: text });
    } catch (e) { /* user cancelled */ }
  } else {
    try {
      await navigator.clipboard.writeText(text);
      alert("Sharing isn't supported here, so the list was copied instead. Paste it into your Keep note.");
    } catch (e) {
      alert(text);
    }
  }
});

// ---- Meals view ----
function renderMeals() {
  const list = document.getElementById("mealsList");
  if (meals.length === 0) {
    list.innerHTML = `<div class="empty-state">No meals yet. Add your first favourite below.</div>`;
    return;
  }
  list.innerHTML = meals.map(m => `
    <div class="meal-card">
      <div class="meal-card-top">
        <div class="meal-name">${escapeHtml(m.name)}</div>
        <div class="meal-card-actions">
          <button class="icon-btn" data-edit="${m.id}" aria-label="Edit ${escapeHtml(m.name)}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="icon-btn danger" data-del="${m.id}" aria-label="Delete ${escapeHtml(m.name)}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
          </button>
        </div>
      </div>
      <div class="meal-ing">${(m.ingredients||[]).map(escapeHtml).join(", ") || "No ingredients added"}</div>
    </div>
  `).join("");

  list.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => openMealModal(btn.dataset.edit));
  });
  list.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => deleteMeal(btn.dataset.del));
  });
}

function deleteMeal(id) {
  meals = meals.filter(m => m.id !== id);
  saveMeals(meals);
  week = week.map(wid => wid === id ? null : wid);
  saveWeek(week);
  renderMeals();
  renderWeek();
}

function openMealModal(id) {
  editingMealId = id || null;
  const meal = id ? mealById(id) : null;
  document.getElementById("mealModalTitle").textContent = id ? "Edit meal" : "Add a meal";
  document.getElementById("mealNameInput").value = meal ? meal.name : "";
  document.getElementById("mealIngInput").value = meal ? (meal.ingredients || []).join("\n") : "";
  document.getElementById("mealModalOverlay").classList.add("active");
  document.getElementById("mealNameInput").focus();
}

function closeMealModal() {
  document.getElementById("mealModalOverlay").classList.remove("active");
  editingMealId = null;
}

document.getElementById("addMealBtn").addEventListener("click", () => openMealModal(null));
document.getElementById("mealCancelBtn").addEventListener("click", closeMealModal);
document.getElementById("mealModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "mealModalOverlay") closeMealModal();
});

document.getElementById("mealSaveBtn").addEventListener("click", () => {
  const name = document.getElementById("mealNameInput").value.trim();
  if (!name) {
    document.getElementById("mealNameInput").focus();
    return;
  }
  const ingredients = document.getElementById("mealIngInput").value
    .split("\n").map(s => s.trim()).filter(Boolean);

  if (editingMealId) {
    const meal = mealById(editingMealId);
    meal.name = name;
    meal.ingredients = ingredients;
  } else {
    meals.push({ id: uid(), name, ingredients });
  }
  saveMeals(meals);
  closeMealModal();
  renderMeals();
  renderWeek();
});

// ---- Nav ----
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const target = btn.dataset.view;
    document.getElementById("planView").classList.toggle("active", target === "plan");
    document.getElementById("mealsView").classList.toggle("active", target === "meals");
    document.getElementById("pageTitle").textContent = target === "plan" ? "What's for tea?" : "My meals";
    document.getElementById("pageSubtitle").textContent = target === "plan"
      ? "Tap the button, get a week of dinners."
      : "Define your favourites and their ingredients.";
  });
});

// ---- Service worker ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// ---- Init ----
renderWeek();
renderMeals();
</script>
</body>
</html>
