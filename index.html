<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's for tea?</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E85D3D">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #FFF6EA; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: #3A2318;
    padding-bottom: 78px;
    overflow-x: hidden;
    position: relative;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; filter: blur(40px); opacity: 0.35;
    z-index: 0; pointer-events: none; animation: float 7s ease-in-out infinite;
  }
  body::before { width: 220px; height: 220px; background: #F5B942; top: -60px; left: -60px; }
  body::after { width: 260px; height: 260px; background: #7BB8A8; bottom: -80px; right: -70px; animation-delay: -3.5s; }
  @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(10px,-18px); } }
  h1, h2, .heading { font-family: 'Baloo 2', system-ui, sans-serif; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 26px 20px 20px; position: relative; z-index: 1; }
  .header { text-align: center; margin-bottom: 4px; }
  .header h1 { font-weight: 800; font-size: 28px; margin: 0 0 2px; letter-spacing: -0.3px; animation: popIn 0.5s ease; }
  .header p { color: #8A7768; font-size: 14px; margin: 0; font-weight: 600; }

  .view { display: none; }
  .view.active { display: block; }

  /* Shuffle button */
  .shuffle-wrap { display: flex; justify-content: center; margin: 20px 0 10px; }
  .shuffle-btn {
    width: 140px; height: 140px; border-radius: 50%; border: none;
    background: linear-gradient(145deg, #F5B942, #E85D3D);
    box-shadow: 0 10px 0 #C8461F, 0 14px 22px rgba(232,93,61,0.35);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px;
    transition: transform 0.12s ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .shuffle-btn:hover { transform: rotate(-3deg) scale(1.03); }
  }
  .shuffle-btn:active { transform: scale(0.95) translateY(4px); box-shadow: 0 4px 0 #C8461F; }
  .shuffle-btn:disabled { background: #E4DDD0; box-shadow: none; cursor: not-allowed; }
  .shuffle-btn.spin svg { animation: spin 0.4s linear; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes pop { 0%{transform:scale(1) rotate(0)} 30%{transform:scale(.92) rotate(-4deg)} 60%{transform:scale(1.05) rotate(3deg)} 100%{transform:scale(1) rotate(0)} }
  .shuffle-btn.pop { animation: pop 0.4s ease; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
  .day-row.wiggle { animation: wiggle 0.36s ease; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.85) translateY(6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  .day-row.pop-in { animation: popIn 0.35s ease backwards; }

  .week-header { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
  .week-header h2 { font-size: 15px; font-weight: 700; margin: 0; color: #8A7768; }
  .reset-link {
    border: none; background: transparent; color: #B4472E; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: 'Nunito', sans-serif; padding: 4px;
  }

  /* Day rows */
  .day-row {
    display: flex; align-items: center; background: #fff; border-radius: 16px;
    padding: 12px 13px; margin-bottom: 9px; border: 1.5px solid #F0E6D6;
  }
  .day-row.locked { border-color: #F5B942; background: #FFFBF0; }
  .day-badge {
    width: 42px; height: 42px; border-radius: 12px; background: #FBEFD9; color: #C4791A;
    display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif;
    font-weight: 700; font-size: 12px; margin-right: 12px; flex-shrink: 0;
  }
  .day-meal-btn {
    flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 0;
    font-family: inherit; cursor: pointer;
  }
  .day-meal { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #3A2318; }
  .day-meal.empty { color: #C9BBA9; font-weight: 600; }
  .lock-tag { font-size: 11px; color: #B4791A; font-weight: 700; margin-top: 1px; display: flex; align-items: center; gap: 3px; }
  .day-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .reroll-btn, .lock-btn {
    border: none; background: #F5F1E8; width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; color: #8A7768; cursor: pointer;
  }
  .lock-btn.active { background: #F5B942; color: #fff; }
  .reroll-btn:active { transform: scale(0.9) rotate(90deg); }

  /* Shopping list card */
  .shop-card { background: #fff; border-radius: 16px; border: 1.5px solid #F0E6D6; padding: 16px; margin-top: 18px; }
  .shop-card h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .shop-card p.hint { font-size: 13px; color: #8A7768; margin: 0 0 12px; font-weight: 600; }
  .shop-list { font-size: 14px; line-height: 1.9; margin: 0 0 14px; padding-left: 18px; }
  .shop-actions { display: flex; gap: 8px; }
  .btn-secondary {
    flex: 1; border: 1.5px solid #E8DFCE; background: #FFFCF6; color: #3A2318; font-weight: 700;
    border-radius: 12px; padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary {
    flex: 1; border: none; background: #5B7F4B; color: #fff; font-weight: 700;
    border-radius: 12px; padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-danger-outline {
    border: 1.5px solid #F0C9B8; background: #FFF9F5; color: #B4472E; font-weight: 700;
    border-radius: 12px; padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .btn-secondary:active, .btn-primary:active, .btn-danger-outline:active { transform: scale(0.97); }

  /* Meals view */
  .meal-card {
    background: #fff; border-radius: 16px; border: 1.5px solid #F0E6D6; padding: 14px; margin-bottom: 10px;
  }
  .meal-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .meal-name { font-weight: 700; font-size: 16px; }
  .meal-ing { font-size: 13px; color: #8A7768; font-weight: 600; line-height: 1.5; }
  .meal-card-actions { display: flex; gap: 6px; }
  .icon-btn {
    border: none; background: #F5F1E8; width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; color: #8A7768; cursor: pointer;
  }
  .icon-btn.danger { color: #B4472E; }

  .add-meal-btn {
    width: 100%; border: 2px dashed #E8DFCE; background: transparent; color: #8A7768; font-weight: 700;
    border-radius: 16px; padding: 14px; font-size: 15px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
  }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(58,35,24,0.4); z-index: 50;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #FFF6EA; width: 100%; max-width: 460px; border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto;
  }
  #mealModalOverlay .modal {
    min-height: 90vh; max-height: 92vh; display: flex; flex-direction: column;
  }
  #mealModalOverlay .modal-actions { margin-top: auto; padding-top: 14px; }
  .modal h2 { font-size: 19px; font-weight: 700; margin: 0 0 14px; }
  .field-label { font-size: 13px; font-weight: 700; color: #8A7768; margin: 0 0 6px; display: block; }
  .field-input, .field-textarea, .field-select {
    width: 100%; border: 1.5px solid #F0E6D6; background: #fff; border-radius: 12px; padding: 11px 13px;
    font-size: 15px; font-family: inherit; font-weight: 600; color: #3A2318; outline: none; margin-bottom: 14px;
  }
  .field-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  #mealModalOverlay .field-textarea { flex: 1; min-height: 140px; }
  .lock-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px; background: #fff;
    border: 1.5px solid #F0E6D6; border-radius: 12px; padding: 12px 13px;
  }
  .lock-row input[type="checkbox"] { width: 19px; height: 19px; accent-color: #E85D3D; flex-shrink: 0; }
  .lock-row label { font-size: 14px; font-weight: 700; color: #3A2318; }
  .lock-row .sub { display: block; font-size: 12px; font-weight: 600; color: #8A7768; margin-top: 1px; }
  .modal-actions { display: flex; gap: 8px; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1.5px solid #F0E6D6;
    display: flex; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); z-index: 30;
  }
  .nav-btn {
    flex: 1; border: none; background: transparent; display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #B3A594;
    cursor: pointer;
  }
  .nav-btn.active { color: #E85D3D; }

  .empty-state { text-align: center; color: #B3A594; font-size: 14px; font-weight: 600; padding: 30px 10px; }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <h1 id="pageTitle">What's for tea? 🍲</h1>
    <p id="pageSubtitle">Tap the button, get a week of dinners.</p>
  </div>

  <!-- PLAN VIEW -->
  <div class="view active" id="planView">
    <div class="shuffle-wrap">
      <button class="shuffle-btn" id="shuffleBtn">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
        <span id="shuffleLabel">Plan my week</span>
      </button>
    </div>

    <div class="week-header">
      <h2>Locked days stay put when you shuffle</h2>
      <button class="reset-link" id="resetWeekBtn">Reset week</button>
    </div>

    <div id="weekList"></div>
  </div>

  <!-- SHOPPING LIST VIEW -->
  <div class="view" id="shopView">
    <div class="shop-card">
      <p class="hint">Ingredients for everything planned this week.</p>
      <ul class="shop-list" id="shopList"></ul>
      <div class="shop-actions">
        <button class="btn-secondary" id="copyBtn">Copy</button>
        <button class="btn-primary" id="shareBtn">Send to Keep</button>
      </div>
    </div>
  </div>

  <!-- MEALS VIEW -->
  <div class="view" id="mealsView">
    <div id="mealsList"></div>
    <button class="add-meal-btn" id="addMealBtn">🍽️ Add a meal</button>
  </div>

</div>

<div class="bottom-nav">
  <button class="nav-btn active" data-view="plan">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    This week
  </button>
  <button class="nav-btn" data-view="shop">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1.3" fill="currentColor" stroke="none"/><circle cx="18" cy="21" r="1.3" fill="currentColor" stroke="none"/><path d="M2.5 3h2l2.4 12.2a2 2 0 002 1.6h8.4a2 2 0 002-1.6L21 8H6"/></svg>
    Shopping list
  </button>
  <button class="nav-btn" data-view="meals">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M14 3v5h5"/></svg>
    My meals
  </button>
</div>

<!-- Meal editor modal -->
<div class="modal-overlay" id="mealModalOverlay">
  <div class="modal">
    <h2 id="mealModalTitle">Add a meal</h2>
    <label class="field-label">Meal name</label>
    <input class="field-input" id="mealNameInput" placeholder="e.g. Fish pie">
    <label class="field-label">Ingredients (one per line)</label>
    <textarea class="field-textarea" id="mealIngInput" placeholder="Salmon fillets&#10;Mashed potato&#10;Peas&#10;Cheddar"></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" id="mealCancelBtn">Cancel</button>
      <button class="btn-primary" id="mealSaveBtn">Save meal</button>
    </div>
  </div>
</div>

<!-- Day editor modal -->
<div class="modal-overlay" id="dayModalOverlay">
  <div class="modal">
    <h2 id="dayModalTitle">Edit day</h2>
    <label class="field-label">Meal</label>
    <input class="field-input" id="dayTextInput" placeholder="Type a meal, e.g. Takeaway">
    <label class="field-label">Or pick a favourite</label>
    <select class="field-select" id="dayQuickPick">
      <option value="">Choose a favourite…</option>
    </select>
    <div class="lock-row">
      <input type="checkbox" id="dayLockCheckbox">
      <label for="dayLockCheckbox">Lock this day
        <span class="sub">Shuffle will skip it and leave it as is</span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn-danger-outline" id="dayClearBtn">Clear day</button>
      <button class="btn-primary" id="daySaveBtn">Save</button>
    </div>
  </div>
</div>

<script>

const STORE_MEALS = "mp_meals_v1";
const STORE_WEEK = "mp_week_v2";

const DAY_COLORS = [
  { bg: "#FBE3DC", fg: "#C9503B" },
  { bg: "#FBEFD9", fg: "#C4791A" },
  { bg: "#EAF2D0", fg: "#6E8B1F" },
  { bg: "#DCF2EC", fg: "#2F8F7A" },
  { bg: "#DDEBFB", fg: "#3A72B8" },
  { bg: "#E9E0F7", fg: "#7B5AC4" },

const MEAL_EMOJI_MAP = [
  [/pizza/i, "🍕"],
  [/taco|burrito|fajita/i, "🌮"],
  [/curry/i, "🍛"],
  [/pasta|spaghetti|bolognese|lasagne|lasagna/i, "🍝"],
  [/noodle|stir.?fry|ramen/i, "🍜"],
  [/rice/i, "🍚"],
  [/fish|salmon|prawn|shrimp/i, "🐟"],
  [/chicken/i, "🍗"],
  [/beef|steak|burger/i, "🍔"],
  [/pork|bacon|sausage/i, "🥓"],
  [/salad/i, "🥗"],
  [/soup/i, "🍲"],
  [/sandwich|wrap/i, "🥪"],
  [/egg/i, "🍳"],
  [/pie/i, "🥧"],
  [/roast/i, "🍖"],
  [/bbq|barbecue|grill/i, "🍖"],
  [/takeaway|take.?away|chinese/i, "🥡"],
  [/veg/i, "🥦"],
];
function getMealEmoji(name) {
  if (!name) return "🍽️";
  for (const [re, emoji] of MEAL_EMOJI_MAP) {
    if (re.test(name)) return emoji;
  }
  return "🍽️";
}

function playNomSound() {
  try {
    NOM_SOUND.currentTime = 0;
    NOM_SOUND.play().catch(() => {});
  } catch (e) {}
}

function spawnConfetti(originEl) {
  const rect = originEl.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;
  for (let i = 0; i < 18; i++) {
    const el = document.createElement("span");
    el.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
    el.style.cssText = `position:fixed; left:${originX}px; top:${originY}px; font-size:${14 + Math.random() * 10}px; pointer-events:none; z-index:60; will-change:transform,opacity;`;
    document.body.appendChild(el);
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 120;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 40;
    const rot = (Math.random() - 0.5) * 360;
    const duration = 700 + Math.random() * 500;
    el.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 160}px) rotate(${rot}deg)`, opacity: 0 },
    ], { duration, easing: "cubic-bezier(.2,.7,.3,1)" });
    setTimeout(() => el.remove(), duration + 50);
  }
}

const STARTER_MEALS = [
  { id: "m1", name: "Spaghetti bolognese", ingredients: ["Mince beef","Spaghetti","Tinned tomatoes","Onion","Garlic","Parmesan"] },
  { id: "m2", name: "Tacos", ingredients: ["Taco shells","Mince beef","Cheddar","Lettuce","Salsa","Soured cream"] },
  { id: "m3", name: "Chicken curry", ingredients: ["Chicken thighs","Curry paste","Coconut milk","Rice","Coriander"] },
  { id: "m4", name: "Stir fry", ingredients: ["Noodles","Mixed veg","Soy sauce","Chicken or tofu","Ginger"] },
  { id: "m5", name: "Pizza night", ingredients: ["Pizza bases","Mozzarella","Passata","Toppings of choice"] },
];

function loadMeals() {
  try {
    const raw = localStorage.getItem(STORE_MEALS);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return STARTER_MEALS;
}
function saveMeals(m) { localStorage.setItem(STORE_MEALS, JSON.stringify(m)); }

// week[i] is either null (empty) or { text: string, locked: bool }
function loadWeek() {
  try {
    const raw = localStorage.getItem(STORE_WEEK);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  // migrate from old format (array of meal ids or null)
  try {
    const oldRaw = localStorage.getItem(STORE_WEEK_OLD);
    if (oldRaw) {
      const oldWeek = JSON.parse(oldRaw);
      const m = loadMeals();
      return oldWeek.map(id => {
        if (!id) return null;
        const meal = m.find(x => x.id === id);
        return { text: meal ? meal.name : id, locked: false };
      });
    }
  } catch (e) {}
  return Array(7).fill(null);
}
function saveWeek(w) { localStorage.setItem(STORE_WEEK, JSON.stringify(w)); }

let meals = loadMeals();
let week = loadWeek();
let editingMealId = null;
let editingDayIndex = null;

function uid() { return "m" + Date.now() + Math.floor(Math.random()*1000); }
function mealById(id) { return meals.find(m => m.id === id); }
function mealByName(name) {
  if (!name) return null;
  const key = name.trim().toLowerCase();
  return meals.find(m => m.name.trim().toLowerCase() === key) || null;
}

function pickWeek() {
  const names = meals.map(m => m.name);
  const result = week.map(d => d && d.locked ? d : null);
  const slotsToFill = [];
  result.forEach((d, i) => { if (!d) slotsToFill.push(i); });

  let deck = [];
  let lastPicked = null;
  slotsToFill.forEach((i) => {
    if (deck.length === 0) {
      deck = [...names].sort(() => Math.random() - 0.5);
      if (lastPicked && deck[0] === lastPicked && deck.length > 1) {
        [deck[0], deck[1]] = [deck[1], deck[0]];
      }
    }
    const pick = deck.pop();
    lastPicked = pick;
    result[i] = { text: pick, locked: false };
  });
  return result;
}

function renderWeek() {
  const list = document.getElementById("weekList");
  list.innerHTML = "";
  const hasPlan = week.some(d => d !== null);
  document.getElementById("shuffleLabel").textContent = hasPlan ? "Shuffle again" : "Plan my week";
  document.getElementById("shuffleBtn").disabled = meals.length === 0;

  DAYS.forEach((day, i) => {
    const d = week[i];
    const row = document.createElement("div");
    row.className = "day-row pop-in" + (d && d.locked ? " locked" : "");
    row.style.animationDelay = (i * 0.05) + "s";
    row.id = "day-" + i;
    const col = DAY_COLORS[i];
    row.innerHTML = `
      <div class="day-badge" style="background:${col.bg}; color:${col.fg};">${day}</div>
      <button class="day-meal-btn" data-open="${i}">
        <div class="day-meal ${d ? "" : "empty"}">${d ? getMealEmoji(d.text) + " " + escapeHtml(d.text) : "🎲 Not decided yet"}</div>
        ${d && d.locked ? `<div class="lock-tag"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V7a5 5 0 00-5-5zm-3 8V7a3 3 0 016 0v3z"/></svg>Locked</div>` : ""}
      </button>
      <div class="day-actions">
        ${(d && !d.locked) ? `<button class="reroll-btn" data-reroll="${i}" aria-label="Reroll ${day}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0114.85-3.36L23 10M1 14l4.65 4.36A9 9 0 0020.5 15"/></svg>
        </button>` : ""}
        <button class="lock-btn ${d && d.locked ? "active" : ""}" data-lock="${i}" aria-label="${d && d.locked ? "Unlock" : "Lock"} ${day}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V7a5 5 0 00-5-5zm-3 8V7a3 3 0 016 0v3z"/></svg>
        </button>
      </div>
    `;
    list.appendChild(row);
  });

  document.querySelectorAll("[data-open]").forEach(btn => {
    btn.addEventListener("click", () => openDayModal(parseInt(btn.dataset.open)));
  });
  document.querySelectorAll("[data-reroll]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); rerollDay(parseInt(btn.dataset.reroll)); });
  });
  document.querySelectorAll("[data-lock]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); toggleLock(parseInt(btn.dataset.lock)); });
  });

  renderShoppingList();
}

function toggleLock(i) {
  if (!week[i]) return; // nothing to lock
  week[i] = { ...week[i], locked: !week[i].locked };
  saveWeek(week);
  renderWeek();
}

function shuffleAll() {
  if (meals.length === 0) return;
  const btn = document.getElementById("shuffleBtn");
  btn.classList.add("pop", "spin");
  playNomSound();
  setTimeout(() => {
    week = pickWeek();
    saveWeek(week);
    renderWeek();
    btn.classList.remove("pop", "spin");
    spawnConfetti(btn);
    document.getElementById("pageSubtitle").textContent = FUN_MESSAGES[Math.floor(Math.random() * FUN_MESSAGES.length)];
  }, 380);
}

function rerollDay(i) {
  if (meals.length === 0) return;
  if (week[i] && week[i].locked) return;
  const currentText = week[i] ? week[i].text : null;
  const others = meals.filter(m => m.name !== currentText);
  const pool = others.length ? others : meals;
  const next = pool[Math.floor(Math.random() * pool.length)];
  week[i] = { text: next.name, locked: false };
  saveWeek(week);
  renderWeek();
  const row = document.getElementById("day-" + i);
  if (row) {
    row.classList.add("wiggle");
    setTimeout(() => row.classList.remove("wiggle"), 380);
  }
}

function resetWeek() {
  if (!confirm("Clear the whole week, including locked days?")) return;
  week = Array(7).fill(null);
  saveWeek(week);
  renderWeek();
}
document.getElementById("resetWeekBtn").addEventListener("click", resetWeek);

function buildShoppingList() {
  const seen = new Map();
  week.forEach(d => {
    if (!d) return;
    const meal = mealByName(d.text);
    if (!meal) return;
    (meal.ingredients || []).forEach(ing => {
      const key = ing.trim().toLowerCase();
      if (key && !seen.has(key)) seen.set(key, ing.trim());
    });
  });
  return [...seen.values()];
}

function renderShoppingList() {
  const items = buildShoppingList();
  const ul = document.getElementById("shopList");
  if (items.length === 0) {
    ul.innerHTML = `<li style="list-style:none; margin-left:-18px; color:#B3A594; font-weight:600;">Plan your week to build a shopping list.</li>`;
    return;
  }
  ul.innerHTML = items.map(i => `<li>${escapeHtml(i)}</li>`).join("");
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById("shuffleBtn").addEventListener("click", shuffleAll);

document.getElementById("copyBtn").addEventListener("click", async () => {
  const items = buildShoppingList();
  if (items.length === 0) return;
  const text = items.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = original, 1400);
  } catch (e) {
    alert(text);
  }
});

document.getElementById("shareBtn").addEventListener("click", async () => {
  const items = buildShoppingList();
  if (items.length === 0) return;
  const text = items.join("\n");
  if (navigator.share) {
    try {
      await navigator.share({ title: "Shopping list", text: text });
    } catch (e) { /* user cancelled */ }
  } else {
    try {
      await navigator.clipboard.writeText(text);
      alert("Sharing isn't supported here, so the list was copied instead. Paste it into your Keep note.");
    } catch (e) {
      alert(text);
    }
  }
});

// ---- Day modal ----
function populateQuickPick() {
  const sel = document.getElementById("dayQuickPick");
  sel.innerHTML = `<option value="">Choose a favourite…</option>` +
    meals.map(m => `<option value="${escapeHtml(m.name)}">${escapeHtml(m.name)}</option>`).join("");
}

function openDayModal(i) {
  editingDayIndex = i;
  const d = week[i];
  document.getElementById("dayModalTitle").textContent = "Edit " + DAYS[i];
  document.getElementById("dayTextInput").value = d ? d.text : "";
  document.getElementById("dayLockCheckbox").checked = !!(d && d.locked);
  populateQuickPick();
  document.getElementById("dayQuickPick").value = "";
  document.getElementById("dayModalOverlay").classList.add("active");
  document.getElementById("dayTextInput").focus();
}
function closeDayModal() {
  document.getElementById("dayModalOverlay").classList.remove("active");
  editingDayIndex = null;
}
document.getElementById("dayQuickPick").addEventListener("change", (e) => {
  if (e.target.value) document.getElementById("dayTextInput").value = e.target.value;
});
document.getElementById("dayModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "dayModalOverlay") closeDayModal();
});
document.getElementById("dayClearBtn").addEventListener("click", () => {
  if (editingDayIndex === null) return;
  week[editingDayIndex] = null;
  saveWeek(week);
  closeDayModal();
  renderWeek();
});
document.getElementById("daySaveBtn").addEventListener("click", () => {
  if (editingDayIndex === null) return;
  const text = document.getElementById("dayTextInput").value.trim();
  const locked = document.getElementById("dayLockCheckbox").checked;
  if (!text) {
    week[editingDayIndex] = null;
  } else {
    week[editingDayIndex] = { text, locked };
  }
  saveWeek(week);
  closeDayModal();
  renderWeek();
});

// ---- Meals view ----
function renderMeals() {
  const list = document.getElementById("mealsList");
  if (meals.length === 0) {
    list.innerHTML = `<div class="empty-state">🍽️ No meals yet. Add your first favourite below.</div>`;
    return;
  }
  list.innerHTML = meals.map(m => `
    <div class="meal-card">
      <div class="meal-card-top">
        <div class="meal-name">${getMealEmoji(m.name)} ${escapeHtml(m.name)}</div>
        <div class="meal-card-actions">
          <button class="icon-btn" data-edit="${m.id}" aria-label="Edit ${escapeHtml(m.name)}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="icon-btn danger" data-del="${m.id}" aria-label="Delete ${escapeHtml(m.name)}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
          </button>
        </div>
      </div>
      <div class="meal-ing">${(m.ingredients||[]).map(escapeHtml).join(", ") || "No ingredients added"}</div>
    </div>
  `).join("");

  list.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => openMealModal(btn.dataset.edit));
  });
  list.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => deleteMeal(btn.dataset.del));
  });
}

function deleteMeal(id) {
  const meal = mealById(id);
  meals = meals.filter(m => m.id !== id);
  saveMeals(meals);
  if (meal) {
    week = week.map(d => (d && d.text === meal.name) ? null : d);
    saveWeek(week);
  }
  renderMeals();
  renderWeek();
}

function openMealModal(id) {
  editingMealId = id || null;
  const meal = id ? mealById(id) : null;
  document.getElementById("mealModalTitle").textContent = id ? "Edit meal" : "Add a meal";
  document.getElementById("mealNameInput").value = meal ? meal.name : "";
  document.getElementById("mealIngInput").value = meal ? (meal.ingredients || []).join("\n") : "";
  document.getElementById("mealModalOverlay").classList.add("active");
  document.getElementById("mealNameInput").focus();
}
function closeMealModal() {
  document.getElementById("mealModalOverlay").classList.remove("active");
  editingMealId = null;
}
document.getElementById("addMealBtn").addEventListener("click", () => openMealModal(null));
document.getElementById("mealCancelBtn").addEventListener("click", closeMealModal);
document.getElementById("mealModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "mealModalOverlay") closeMealModal();
});
document.getElementById("mealSaveBtn").addEventListener("click", () => {
  const name = document.getElementById("mealNameInput").value.trim();
  if (!name) {
    document.getElementById("mealNameInput").focus();
    return;
  }
  const ingredients = document.getElementById("mealIngInput").value
    .split("\n").map(s => s.trim()).filter(Boolean);
  const oldName = editingMealId ? mealById(editingMealId).name : null;

  if (editingMealId) {
    const meal = mealById(editingMealId);
    meal.name = name;
    meal.ingredients = ingredients;
    if (oldName && oldName !== name) {
      week = week.map(d => (d && d.text === oldName) ? { ...d, text: name } : d);
      saveWeek(week);
    }
  } else {
    meals.push({ id: uid(), name, ingredients });
  }
  saveMeals(meals);
  closeMealModal();
  renderMeals();
  renderWeek();
});

// ---- Nav ----
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const target = btn.dataset.view;
    document.getElementById("planView").classList.toggle("active", target === "plan");
    document.getElementById("shopView").classList.toggle("active", target === "shop");
    document.getElementById("mealsView").classList.toggle("active", target === "meals");
    const titles = { plan: "What's for tea? 🍲", shop: "Shopping list 🛒", meals: "My meals 📖" };
    const subtitles = {
      plan: "Tap the button, get a week of dinners.",
      shop: "Everything you need for the week ahead.",
      meals: "Define your favourites and their ingredients.",
    };
    document.getElementById("pageTitle").textContent = titles[target];
    document.getElementById("pageSubtitle").textContent = subtitles[target];
  });
});

// ---- Service worker ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// ---- Init ----
renderWeek();
renderMeals();
</script>
</body>
</html>
